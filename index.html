<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Crew Quote Parser</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #222222;
    --border: rgba(255,255,255,0.08);
    --border-hover: rgba(255,255,255,0.16);
    --text: #f0ede8;
    --text-muted: #888;
    --text-faint: #555;
    --accent: #e8c547;
    --accent-dim: rgba(232,197,71,0.12);
    --success: #4caf7d;
    --success-dim: rgba(76,175,125,0.12);
    --warning: #e09d4a;
    --warning-dim: rgba(224,157,74,0.12);
    --danger: #e05a5a;
    --danger-dim: rgba(224,90,90,0.12);
    --radius: 10px;
    --radius-sm: 6px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding: 2rem 1rem 4rem;
  }

  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap');

  .container {
    max-width: 760px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 2.5rem;
    padding-bottom: 1.5rem;
    border-bottom: 0.5px solid var(--border);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }

  .logo-icon {
    width: 32px;
    height: 32px;
    background: var(--accent);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-icon svg { width: 18px; height: 18px; }

  h1 {
    font-size: 20px;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  .subtitle {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  /* API Key section */
  .api-section {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.25rem;
    margin-bottom: 1.25rem;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .api-label {
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .api-input-wrap {
    flex: 1;
    position: relative;
  }

  input[type="text"], input[type="password"] {
    width: 100%;
    background: var(--surface2);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 13px;
    font-family: 'DM Mono', monospace;
    padding: 8px 12px;
    outline: none;
    transition: border-color 0.15s;
  }

  input[type="text"]:focus, input[type="password"]:focus {
    border-color: var(--border-hover);
  }

  .toggle-key {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 4px;
    white-space: nowrap;
  }

  .toggle-key:hover { color: var(--text); }

  /* Upload zone */
  .upload-zone {
    border: 0.5px dashed var(--border-hover);
    border-radius: var(--radius);
    padding: 3rem 2rem;
    text-align: center;
    cursor: pointer;
    background: var(--surface);
    transition: all 0.2s;
    margin-bottom: 1rem;
  }

  .upload-zone:hover, .upload-zone.dragover {
    border-color: var(--accent);
    background: var(--accent-dim);
  }

  .upload-icon {
    width: 40px;
    height: 40px;
    margin: 0 auto 12px;
    color: var(--text-muted);
  }

  .upload-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 4px;
  }

  .upload-sub {
    font-size: 13px;
    color: var(--text-muted);
  }

  /* File info */
  .file-info {
    display: none;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-bottom: 1rem;
    align-items: center;
    gap: 12px;
  }

  .file-info.visible { display: flex; }

  .file-pdf-icon {
    color: var(--danger);
    font-size: 20px;
    flex-shrink: 0;
  }

  .file-name {
    flex: 1;
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .file-size {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 1px;
  }

  /* Controls row */
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 1.5rem;
  }

  .job-input {
    flex: 1;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    padding: 0 14px;
    height: 42px;
    outline: none;
    transition: border-color 0.15s;
  }

  .job-input::placeholder { color: var(--text-faint); }
  .job-input:focus { border-color: var(--border-hover); }

  .parse-btn {
    background: var(--accent);
    color: #0f0f0f;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 500;
    font-family: 'DM Sans', sans-serif;
    padding: 0 22px;
    height: 42px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: opacity 0.15s, transform 0.1s;
    white-space: nowrap;
  }

  .parse-btn:hover { opacity: 0.9; }
  .parse-btn:active { transform: scale(0.98); }
  .parse-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

  .remove-btn {
    background: none;
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-muted);
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    padding: 0 12px;
    height: 32px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }

  .remove-btn:hover { color: var(--text); border-color: var(--border-hover); }

  /* Loading */
  .loading {
    display: none;
    text-align: center;
    padding: 2rem;
    color: var(--text-muted);
    font-size: 14px;
  }

  .loading.visible { display: block; }

  .spinner {
    width: 24px;
    height: 24px;
    border: 2px solid var(--border-hover);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Error */
  .error {
    display: none;
    background: var(--danger-dim);
    border: 0.5px solid rgba(224,90,90,0.3);
    border-radius: var(--radius);
    padding: 12px 16px;
    font-size: 14px;
    color: var(--danger);
    margin-bottom: 1rem;
  }

  .error.visible { display: block; }

  /* Results */
  .results {
    display: none;
  }

  .results.visible { display: block; }

  .results-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
    padding-bottom: 0.75rem;
    border-bottom: 0.5px solid var(--border);
  }

  .results-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    font-weight: 500;
  }

  .total-badge {
    background: var(--accent-dim);
    color: var(--accent);
    font-size: 12px;
    font-weight: 500;
    padding: 3px 12px;
    border-radius: 999px;
    border: 0.5px solid rgba(232,197,71,0.2);
  }

  /* Meta row */
  .meta-row {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 1.25rem;
  }

  .meta-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--text-muted);
  }

  .meta-item span { color: var(--text); }

  /* Crew grid */
  .crew-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px;
    margin-bottom: 1.25rem;
  }

  .crew-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    transition: border-color 0.15s;
  }

  .crew-card:hover { border-color: var(--border-hover); }

  .crew-qty {
    font-size: 28px;
    font-weight: 300;
    color: var(--text);
    line-height: 1;
    margin-bottom: 4px;
    letter-spacing: -0.02em;
  }

  .crew-role {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 6px;
    line-height: 1.3;
  }

  .crew-detail {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 8px;
    font-family: 'DM Mono', monospace;
  }

  .confidence-badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 500;
  }

  .conf-high { background: var(--success-dim); color: var(--success); }
  .conf-medium { background: var(--warning-dim); color: var(--warning); }
  .conf-low { background: var(--danger-dim); color: var(--danger); }

  /* Notes */
  .notes {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.7;
    margin-bottom: 1.25rem;
  }

  .notes p + p { margin-top: 6px; }

  /* Action buttons */
  .action-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .action-btn {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-muted);
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    padding: 0 16px;
    height: 34px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: color 0.15s, border-color 0.15s;
  }

  .action-btn:hover { color: var(--text); border-color: var(--border-hover); }

  /* Footer */
  footer {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 0.5px solid var(--border);
    font-size: 12px;
    color: var(--text-faint);
    text-align: center;
    line-height: 1.6;
  }

  footer a { color: var(--text-muted); text-decoration: none; }
  footer a:hover { color: var(--text); }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#0f0f0f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
      </div>
      <h1>Crew Quote Parser</h1>
    </div>
    <p class="subtitle">Extract crew roles & quantities from Xero quote PDFs using AI</p>
  </header>

  <!-- Upload -->
  <div class="upload-zone" id="dropZone" onclick="document.getElementById('pdfInput').click()">
    <div class="upload-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
    </div>
    <div class="upload-title">Drop your Xero quote PDF here</div>
    <div class="upload-sub">or click to browse</div>
  </div>
  <input type="file" id="pdfInput" accept="application/pdf" style="display:none" onchange="handleFile(this.files[0])" />

  <!-- File info -->
  <div class="file-info" id="fileInfo">
    <svg class="file-pdf-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="24" height="24" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
    </svg>
    <div style="flex:1; min-width:0;">
      <div class="file-name" id="fileName"></div>
      <div class="file-size" id="fileSize"></div>
    </div>
    <button class="remove-btn" onclick="clearFile()">Remove</button>
  </div>

  <!-- Controls -->
  <div class="controls">
    <input type="text" class="job-input" id="jobName" placeholder="Job name (optional — e.g. Splendour in the Grass 2025)" />
    <button class="parse-btn" id="parseBtn" onclick="parseQuote()" disabled>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>
      Extract crew
    </button>
  </div>

  <!-- Error -->
  <div class="error" id="errorArea"></div>

  <!-- Loading -->
  <div class="loading" id="loadingArea">
    <div class="spinner"></div>
    Analysing quote…
  </div>

  <!-- Results -->
  <div class="results" id="resultsArea">
    <div class="results-header">
      <span class="results-title">Extracted crew</span>
      <span class="total-badge" id="totalBadge"></span>
    </div>
    <div class="meta-row" id="metaRow"></div>
    <div class="crew-grid" id="crewGrid"></div>
    <div class="notes" id="notesArea" style="display:none;"></div>
    <div class="action-row">
      <button class="action-btn" onclick="copyCSV()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy as CSV
      </button>
      <button class="action-btn" onclick="downloadCSV()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download CSV
      </button>
      <button class="action-btn" onclick="resetAll()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg>
        Parse another
      </button>
    </div>
  </div>

  <footer>
    <p>Powered by Claude — your API key is stored securely on the server and never exposed in the browser.</p>
  </footer>

</div>

<script>
let pdfBase64 = null;
let parsedData = null;

// Drag and drop
const dropZone = document.getElementById('dropZone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file && file.type === 'application/pdf') handleFile(file);
  else showError('Please upload a PDF file.');
});

function handleFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    pdfBase64 = reader.result.split(',')[1];
    document.getElementById('fileName').textContent = file.name;
    document.getElementById('fileSize').textContent = (file.size / 1024).toFixed(1) + ' KB';
    document.getElementById('fileInfo').classList.add('visible');
    document.getElementById('parseBtn').disabled = false;
    document.getElementById('errorArea').classList.remove('visible');
  };
  reader.readAsDataURL(file);
}

function clearFile() {
  pdfBase64 = null;
  document.getElementById('pdfInput').value = '';
  document.getElementById('fileInfo').classList.remove('visible');
  document.getElementById('parseBtn').disabled = true;
}

async function parseQuote() {
  if (!pdfBase64) return;

  const jobName = document.getElementById('jobName').value.trim();
  document.getElementById('resultsArea').classList.remove('visible');
  document.getElementById('errorArea').classList.remove('visible');
  document.getElementById('loadingArea').classList.add('visible');
  document.getElementById('parseBtn').disabled = true;

  const systemPrompt = `You are an assistant that extracts crew roles and quantities from staging and events construction quote documents.
Return ONLY valid JSON — no markdown, no backticks, no preamble.
Format exactly:
{
  "job_name": "detected event or job name from the document, or null",
  "quote_number": "quote reference if visible, or null",
  "quote_date": "date if visible as a readable string, or null",
  "crew": [
    {"role": "Rigger", "quantity": 4, "rate": "$45/hr", "hours": 8, "confidence": "high"}
  ],
  "total_crew": 12,
  "non_crew_items": ["Truss hire", "Transport"],
  "notes": "Any ambiguities or assumptions"
}
Rules:
- confidence: "high" = clearly stated, "medium" = inferred, "low" = guessed
- rate and hours are null if not mentioned
- Normalise role names to standard title case (e.g. "crew chief", "RIGGER" → "Crew Chief", "Rigger")
- Only include labour/crew lines — exclude equipment, materials, transport, hire items
- Combine duplicate roles into one entry with summed quantities`;

  try {
    const response = await fetch('/api/parse', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: systemPrompt,
        messages: [{
          role: 'user',
          content: [
            { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: pdfBase64 } },
            { type: 'text', text: `Extract all crew roles and quantities from this quote${jobName ? ` for: ${jobName}` : ''}.` }
          ]
        }]
      })
    });

    const data = await response.json();
    document.getElementById('loadingArea').classList.remove('visible');
    document.getElementById('parseBtn').disabled = false;

    if (!response.ok) {
      showError(data.error?.message || `API error ${response.status} — check your API key.`);
      return;
    }

    const text = data.content.map(b => b.text || '').join('');
    parsedData = JSON.parse(text.replace(/```json|```/g, '').trim());
    renderResults(parsedData, jobName);

  } catch (err) {
    document.getElementById('loadingArea').classList.remove('visible');
    document.getElementById('parseBtn').disabled = false;
    showError(`Error: ${err.message}. Check your API key and internet connection.`);
  }
}

function renderResults(data, jobOverride) {
  // Total badge
  document.getElementById('totalBadge').textContent = `${data.total_crew} total crew`;

  // Meta row
  const meta = document.getElementById('metaRow');
  meta.innerHTML = '';
  const jobLabel = jobOverride || data.job_name;
  if (jobLabel) meta.innerHTML += `<div class="meta-item"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg><span>${jobLabel}</span></div>`;
  if (data.quote_number) meta.innerHTML += `<div class="meta-item"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg><span>${data.quote_number}</span></div>`;
  if (data.quote_date) meta.innerHTML += `<div class="meta-item"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>${data.quote_date}</span></div>`;

  // Crew cards
  const grid = document.getElementById('crewGrid');
  grid.innerHTML = '';
  data.crew.forEach(item => {
    const confClass = item.confidence === 'high' ? 'conf-high' : item.confidence === 'medium' ? 'conf-medium' : 'conf-low';
    let detail = '';
    if (item.rate && item.hours) detail = `${item.rate} · ${item.hours}h`;
    else if (item.rate) detail = item.rate;
    else if (item.hours) detail = `${item.hours}h`;

    const card = document.createElement('div');
    card.className = 'crew-card';
    card.innerHTML = `
      <div class="crew-qty">${item.quantity}</div>
      <div class="crew-role">${item.role}</div>
      ${detail ? `<div class="crew-detail">${detail}</div>` : ''}
      <span class="confidence-badge ${confClass}">${item.confidence}</span>
    `;
    grid.appendChild(card);
  });

  // Notes
  const notesEl = document.getElementById('notesArea');
  let notesHTML = '';
  if (data.non_crew_items?.length) notesHTML += `<p>⊘ Non-crew items skipped: ${data.non_crew_items.join(', ')}</p>`;
  if (data.notes) notesHTML += `<p>↳ ${data.notes}</p>`;
  if (notesHTML) { notesEl.innerHTML = notesHTML; notesEl.style.display = 'block'; }
  else notesEl.style.display = 'none';

  document.getElementById('resultsArea').classList.add('visible');
}

function getCSV() {
  if (!parsedData) return '';
  const job = document.getElementById('jobName').value.trim() || parsedData.job_name || '';
  let csv = 'Job,Quote Number,Quote Date,Role,Quantity,Rate,Hours,Confidence\n';
  parsedData.crew.forEach(r => {
    csv += `"${job}","${parsedData.quote_number || ''}","${parsedData.quote_date || ''}","${r.role}",${r.quantity},"${r.rate || ''}","${r.hours || ''}","${r.confidence}"\n`;
  });
  return csv;
}

function copyCSV() {
  navigator.clipboard.writeText(getCSV()).then(() => {
    const btn = event.target.closest('button');
    const orig = btn.innerHTML;
    btn.innerHTML = '✓ Copied!';
    setTimeout(() => btn.innerHTML = orig, 1800);
  });
}

function downloadCSV() {
  const csv = getCSV();
  const job = document.getElementById('jobName').value.trim() || parsedData?.job_name || 'crew-quote';
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${job.replace(/\s+/g, '-').toLowerCase()}-crew.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function showError(msg) {
  const el = document.getElementById('errorArea');
  el.textContent = msg;
  el.classList.add('visible');
}

function resetAll() {
  clearFile();
  document.getElementById('jobName').value = '';
  document.getElementById('resultsArea').classList.remove('visible');
  document.getElementById('errorArea').classList.remove('visible');
  parsedData = null;
}
</script>
</body>
</html>
